<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Dashboard - Video Collections</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #4a5568;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }
        .stat-label {
            color: #718096;
            margin-top: 5px;
        }
        .word-collection {
            background: #f8f9fa;
            margin-bottom: 25px;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        .word-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
        }
        .word-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4a5568;
        }
        .word-info {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .video-count {
            background: #667eea;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
        }
        .download-btn {
            background: #48bb78;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        .download-btn:hover {
            background: #38a169;
        }
        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .video-item {
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }
        .video-meta {
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: #718096;
        }
        .video-filename {
            font-family: monospace;
            background: #e2e8f0;
            padding: 5px 8px;
            border-radius: 5px;
            font-size: 0.8rem;
            margin-top: 5px;
        }
        .refresh-btn {
            background: #4299e1;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }
        .refresh-btn:hover {
            background: #3182ce;
        }
        .loading {
            text-align: center;
            color: #718096;
            font-style: italic;
            padding: 40px;
        }
        .empty-state {
            text-align: center;
            color: #718096;
            padding: 60px 20px;
        }
        .empty-state h3 {
            color: #4a5568;
            margin-bottom: 10px;
        }
        .path-info {
            background: #e6fffa;
            border: 2px solid #81e6d9;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .path-info strong {
            color: #234e52;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📁 Developer Dashboard</h1>
        
        <div class="path-info">
            <strong>Videos are saved to:</strong> <code>/workspace/uploads/[word]/</code><br>
            <small>Each word gets its own folder with all recorded videos</small>
        </div>

        <button class="refresh-btn" onclick="loadWordCollections()">🔄 Refresh Collections</button>

        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalWords">-</div>
                <div class="stat-label">Total Words</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalVideos">-</div>
                <div class="stat-label">Total Videos</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="completedWords">-</div>
                <div class="stat-label">Complete Sets (10+ videos)</div>
            </div>
        </div>

        <div id="collections">
            <div class="loading">Loading video collections...</div>
        </div>
    </div>

    <script>
        async function loadWordCollections() {
            const collectionsDiv = document.getElementById('collections');
            collectionsDiv.innerHTML = '<div class="loading">Loading video collections...</div>';

            try {
                const response = await fetch('/api/words');
                const words = await response.json();

                if (words.length === 0) {
                    collectionsDiv.innerHTML = `
                        <div class="empty-state">
                            <h3>No videos uploaded yet</h3>
                            <p>Users haven't recorded any videos yet. Once they start recording, videos will appear here organized by word.</p>
                        </div>
                    `;
                    updateStats(0, 0, 0);
                    return;
                }

                // Update stats
                const totalWords = words.length;
                const totalVideos = words.reduce((sum, word) => sum + word.videoCount, 0);
                const completedWords = words.filter(word => word.videoCount >= 10).length;
                updateStats(totalWords, totalVideos, completedWords);

                // Sort words by video count (descending) and then by name
                words.sort((a, b) => {
                    if (b.videoCount !== a.videoCount) {
                        return b.videoCount - a.videoCount;
                    }
                    return a.word.localeCompare(b.word);
                });

                let html = '';
                for (const wordData of words) {
                    html += await createWordCollectionHTML(wordData);
                }

                collectionsDiv.innerHTML = html;

            } catch (error) {
                console.error('Error loading collections:', error);
                collectionsDiv.innerHTML = `
                    <div class="empty-state">
                        <h3>Error loading collections</h3>
                        <p>Could not connect to server. Make sure the Flask server is running.</p>
                    </div>
                `;
            }
        }

        async function createWordCollectionHTML(wordData) {
            const { word, videoCount, createdAt, updatedAt } = wordData;
            
            // Get detailed word stats
            let videosHTML = '';
            try {
                const statsResponse = await fetch(`/api/word-stats/${word}`);
                if (statsResponse.ok) {
                    const stats = await statsResponse.json();
                    videosHTML = createVideosGrid(stats.videos);
                }
            } catch (error) {
                videosHTML = '<p>Could not load video details</p>';
            }

            const statusBadge = videoCount >= 10 ? 
                '<span style="background: #48bb78; color: white; padding: 4px 8px; border-radius: 12px; font-size: 0.8rem;">✓ Complete</span>' :
                '<span style="background: #ed8936; color: white; padding: 4px 8px; border-radius: 12px; font-size: 0.8rem;">Incomplete</span>';

            return `
                <div class="word-collection">
                    <div class="word-header">
                        <div>
                            <div class="word-title">"${word}" ${statusBadge}</div>
                            <div class="video-meta">
                                Created: ${createdAt ? new Date(createdAt).toLocaleString() : 'Unknown'}
                                ${updatedAt ? `• Updated: ${new Date(updatedAt).toLocaleString()}` : ''}
                            </div>
                        </div>
                        <div class="word-info">
                            <div class="video-count">${videoCount} videos</div>
                            <button class="download-btn" onclick="downloadWordVideos('${word}')">
                                📦 Download ZIP
                            </button>
                        </div>
                    </div>
                    ${videosHTML}
                </div>
            `;
        }

        function createVideosGrid(videos) {
            if (!videos || videos.length === 0) {
                return '<p>No video details available</p>';
            }

            let html = '<div class="videos-grid">';
            videos.forEach(video => {
                const uploadDate = new Date(video.uploadedAt).toLocaleString();
                const fileSize = formatFileSize(video.size);
                
                html += `
                    <div class="video-item">
                        <div class="video-meta">
                            <strong>Video ${video.index}</strong><br>
                            Size: ${fileSize}<br>
                            Uploaded: ${uploadDate}
                        </div>
                        <div class="video-filename">${video.filename}</div>
                    </div>
                `;
            });
            html += '</div>';
            return html;
        }

        function updateStats(totalWords, totalVideos, completedWords) {
            document.getElementById('totalWords').textContent = totalWords;
            document.getElementById('totalVideos').textContent = totalVideos;
            document.getElementById('completedWords').textContent = completedWords;
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        async function downloadWordVideos(word) {
            try {
                const response = await fetch(`/api/download-word/${word}`);
                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${word}_videos.zip`;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);
                } else {
                    alert('Failed to download videos');
                }
            } catch (error) {
                console.error('Download error:', error);
                alert('Error downloading videos');
            }
        }

        // Auto-refresh every 30 seconds
        setInterval(loadWordCollections, 30000);

        // Load on page start
        window.addEventListener('load', loadWordCollections);
    </script>
</body>
</html>
